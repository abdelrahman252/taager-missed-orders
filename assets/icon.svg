<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0f1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  
  <!-- Outer ring glow -->
  <rect x="8" y="8" width="240" height="240" rx="46" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  
  <!-- Cart/box body -->
  <rect x="60" y="90" width="136" height="96" rx="14" fill="url(#accent)" opacity="0.15"/>
  <rect x="60" y="90" width="136" height="96" rx="14" fill="none" stroke="url(#accent)" stroke-width="3"/>
  
  <!-- Checkmark inside box -->
  <polyline points="88,138 112,162 168,106" fill="none" stroke="#4f8ef7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Top handle of box -->
  <path d="M96 90 Q96 62 128 62 Q160 62 160 90" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small dots decoration -->
  <circle cx="210" cy="52" r="5" fill="#4f8ef7" opacity="0.5"/>
  <circle cx="46" cy="200" r="4" fill="#6c5ce7" opacity="0.4"/>
  <circle cx="220" cy="190" r="3" fill="#4f8ef7" opacity="0.3"/>
</svg>
