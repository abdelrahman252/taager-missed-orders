name: Build and Release - macOS and Windows
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          for attempt in 1 2 3; do
            echo "Dependency install attempt $attempt..."
            npm ci && exit 0
            sleep 10
          done
          exit 1
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Create env files
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "TAAGER_DASHBOARD_QUERY_SHADOW=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_ORDERS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_PRODUCTS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_CAMPAIGNS=1" >> .env
          echo "TAAGER_MARKETING_INCREMENTAL_SYNC=1" >> .env
      - name: Build macOS x64 and arm64
        run: |
          for i in {1..3}; do
            echo "Build attempt $i..."
            if npm exec -- electron-builder --mac --x64 --arm64 --publish never; then
              echo "Build succeeded!"
              exit 0
            else
              echo "Build failed. Cleaning up mount points and retrying..."
              hdiutil detach "/Volumes/Taager Orders" -force 2>/dev/null || true
              sleep 10
            fi
          done
          echo "Build failed after 3 attempts."
          exit 1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload macOS files to release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
  build-win:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          for attempt in 1 2 3; do
            echo "Dependency install attempt $attempt..."
            npm ci && exit 0
            sleep 10
          done
          exit 1
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Create env files
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "TAAGER_DASHBOARD_QUERY_SHADOW=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_ORDERS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_PRODUCTS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_CAMPAIGNS=1" >> .env
          echo "TAAGER_MARKETING_INCREMENTAL_SYNC=1" >> .env
        shell: bash
      - name: Build Windows
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Windows build attempt $attempt..."
            Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
            npm exec -- electron-builder --win --x64 --publish=never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 10
          }
          exit 1
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Upload Windows files to release
        run: |
          $files = @(Get-ChildItem dist\*.exe,dist\*.blockmap,dist\latest.yml -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "Windows build produced no release artifacts." }
          gh release upload "${{ github.event.release.tag_name }}" ($files | ForEach-Object { $_.FullName }) --clobber --repo "${{ github.repository }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
