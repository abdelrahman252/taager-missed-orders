name: Build and Release - macOS and Windows
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Verify performance architecture
        run: npm run verify:performance
      - name: Run AI reliability QA
        run: npm run qa:ai:full
      - name: Verify expected NDR financial core
        run: node scripts/verify-dashboard-expected-financial-core.js
      - name: Verify recovery flows
        run: |
          npm run verify:taager-recovery
          npm run verify:stage1-recovery
          npm run verify:stage2-recovery
          npm run verify:stage3-recovery

  build-mac-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Create env files
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "TAAGER_DASHBOARD_QUERY_SHADOW=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_ORDERS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_PRODUCTS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_CAMPAIGNS=1" >> .env
          echo "TAAGER_MARKETING_INCREMENTAL_SYNC=1" >> .env
      - name: Build arm64
        run: npm exec -- electron-builder --mac --arm64 --publish never
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload arm64 files to release
        run: gh release upload ${{ github.event.release.tag_name }} dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-mac-x64:
    name: Build macOS x64
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Create env files
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "TAAGER_DASHBOARD_QUERY_SHADOW=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_ORDERS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_PRODUCTS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_CAMPAIGNS=1" >> .env
          echo "TAAGER_MARKETING_INCREMENTAL_SYNC=1" >> .env
      - name: Build x64
        run: npm exec -- electron-builder --mac --x64 --publish never
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload x64 files to release
        run: gh release upload ${{ github.event.release.tag_name }} dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-win:
    name: Build Windows x64
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Create env files
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "TAAGER_DASHBOARD_QUERY_SHADOW=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_ORDERS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_PRODUCTS=1" >> .env
          echo "TAAGER_DASHBOARD_QUERY_CAMPAIGNS=1" >> .env
          echo "TAAGER_MARKETING_INCREMENTAL_SYNC=1" >> .env
        shell: bash
      - name: Build Windows
        run: npm exec -- electron-builder --win --x64 --publish never
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Upload Windows files to release
        run: gh release upload ${{ github.event.release.tag_name }} (Get-ChildItem dist\*.exe,dist\*.blockmap,dist\latest.yml | ForEach-Object { $_.FullName }) --clobber
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
